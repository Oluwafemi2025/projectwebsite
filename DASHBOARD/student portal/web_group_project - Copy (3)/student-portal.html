<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal</title>
    <link rel="stylesheet" href="/student portal/web_group_project - Copy (3)/css/student-portal.css" />
    <script src="/student portal/web_group_project - Copy (3)/js/student-portal.js" defer></script>
  </head>
  <body>
    <div class="form-container">
      <div class="form-wrapper">
        <div class="logo-container">
          <div class="logo"></div>
        </div>
        <form id="form"  method="get">
          <h1>LOG IN</h1>
          <div class="input-control">
            <label for="matric-no">Matriculation Number</label>
            <input type="text" id="matric-no" name="matric-no" />
            <div class="error"></div>
          </div>
          <div class="input-control">
            <label for="password">Password</label>
            <input type="password" id="pword" name="pword" />
            <div class="error"></div>
          </div>
          <div class="input-control">
            <label for="Cpword">Confirm Password</label>
            <input type="password" id="Cpword" name="Cpword" />
            <div class="error"></div>
          </div>

          <button type="submit" name="submit">Log in</button>
        </form>
      </div>
    </div>
  </body>
</html>
